<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Qefro is an AI Business Platform that turns customer conversations into business outcomes">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8f7fc"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1080" cy="80" r="160" fill="#7c3aed" opacity="0.06"/>
  <circle cx="80" cy="560" r="140" fill="#0891b2" opacity="0.05"/>

  <rect x="72" y="72" width="56" height="56" rx="14" fill="#7c3aed"/>
  <text x="100" y="110" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#ffffff">Q</text>
  <text x="144" y="110" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#111827">Qefro</text>

  <rect x="72" y="156" width="280" height="34" rx="17" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1.5"/>
  <text x="92" y="178" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="1.1" fill="#6d28d9">AI BUSINESS PLATFORM</text>

  <text x="72" y="248" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="800" fill="#111827">Turn customer conversations</text>
  <text x="72" y="296" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="800" fill="#7c3aed">into business outcomes.</text>

  <text x="72" y="354" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#4b5563">AI with your data, workflows, automations and apps.</text>
  <text x="72" y="384" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#4b5563">Customers get answers. Work actually gets done.</text>

  <rect x="72" y="430" width="320" height="52" rx="12" fill="#7c3aed"/>
  <text x="232" y="462" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#ffffff">Start 14-Day Free Trial</text>

  <text x="72" y="530" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#6b7280">14 days free. Explore Qefro with your business.</text>
  <text x="72" y="598" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600" fill="#7c3aed">qefro.com</text>

  <g transform="translate(690 120)">
    <rect width="430" height="390" rx="20" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
    <text x="28" y="40" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="1.2" fill="#6b7280">COMMAND CHAT</text>
    <text x="402" y="40" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#9ca3af">Workspace</text>

    <rect x="24" y="58" width="382" height="44" rx="10" fill="#f8fafc" stroke="#e5e7eb"/>
    <text x="40" y="86" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#111827">Who owes us money?</text>

    <rect x="24" y="114" width="382" height="72" rx="10" fill="#f5f3ff" stroke="#ddd6fe"/>
    <text x="40" y="142" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#6d28d9">12 overdue · ₹2.4L</text>
    <text x="40" y="166" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#4b5563">Ahmed is 21 days late.</text>

    <rect x="24" y="202" width="382" height="48" rx="10" fill="#7c3aed"/>
    <text x="215" y="232" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#ffffff">Start collection for Ahmed</text>

    <text x="40" y="280" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#059669">Viewing booked · Sat 11:00 · Marina 2BHK</text>

    <rect x="24" y="306" width="88" height="36" rx="18" fill="#ecfeff" stroke="#a5f3fc"/>
    <text x="68" y="329" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" fill="#0e7490">CONVO</text>
    <rect x="122" y="306" width="88" height="36" rx="18" fill="#ecfeff" stroke="#a5f3fc"/>
    <text x="166" y="329" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" fill="#0e7490">DATA</text>
    <rect x="220" y="306" width="88" height="36" rx="18" fill="#f5f3ff" stroke="#c4b5fd"/>
    <text x="264" y="329" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" fill="#6d28d9">ACTION</text>
    <rect x="318" y="306" width="88" height="36" rx="18" fill="#ecfdf5" stroke="#6ee7b7"/>
    <text x="362" y="329" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" fill="#047857">OUTCOME</text>
  </g>
